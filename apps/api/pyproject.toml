[project]
name = "api"
version = "0.1.0"
description = ""
authors = [
    {name = "Vaibhav Lodha",email = "vaibhavlodha1998@gmail.com"}
]
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn[standard] (>=0.53.0,<0.54.0)",
    "sqlalchemy (>=2.0.53,<3.0.0)",
    "alembic (>=1.20.0,<2.0.0)",
    "psycopg[binary] (>=3.3.5,<4.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "redis (>=8.1.0,<9.0.0)",
    "bcrypt (>=5.0.0,<6.0.0)",
    "uuid6 (>=2025.0.1,<2026.0.0)",
]

[tool.poetry]
package-mode = false

[tool.ruff]
# Explicit so `app` is first-party even when ruff runs from the repo root (pre-commit)
src = ["."]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "ruff (>=0.16.7,<0.17.0)",
    "mypy (>=2.3.1,<3.0.0)",
    "fakeredis (>=2.38.0,<3.0.0)",
    "httpx2 (>=2.13.0,<3.0.0)",
    "pre-commit (>=4.6.2,<5.0.0)"
]
